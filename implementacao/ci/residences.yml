name: Residences package
on: [push, pull_request, workflow_dispatch]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: residences
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: residence_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:postgres
        env:
          RESIDENCES_TEST_DATABASE_URL: postgresql://residences:test-only@localhost:5432/residence_test_ci
